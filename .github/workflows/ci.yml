name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Pip
  PROJECT: Pip.xcodeproj
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer the newest Xcode on the image (Xcode 27 when available). iOS 27-only APIs are
          # guarded at compile time, so the project also builds with the iOS 26 SDK.
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true

      - name: Resolve simulator
        id: sim
        run: |
          # Use the newest iPhone available in the runtime list so the workflow does not rot.
          NAME=$(xcrun simctl list devices available | grep -E "iPhone (17|16) Pro \(" | head -1 | sed -E 's/^ *(iPhone [0-9]+ Pro).*/\1/')
          echo "name=${NAME:-iPhone 16 Pro}" >> "$GITHUB_OUTPUT"

      # Simulator builds are ad-hoc signed so the App Group / CloudKit / HealthKit
      # entitlements are present; stripping them makes the test host trap at launch.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            | xcbeautify --renderer github-actions
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/Pip.app

      # A cold simulator makes the XCUITest runner time out "loading Accessibility";
      # booting it ahead of time avoids that.
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in sorted(d, reverse=True) for x in d[rt] if x['name']=='${{ steps.sim.outputs.name }}'))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skip-testing:PipUITests \
            CODE_SIGN_IDENTITY="-" \
            | xcbeautify --renderer github-actions

      - name: UI tests
        run: |
          set -o pipefail
          run_ui() {
            xcodebuild test-without-building \
              -project "$PROJECT" -scheme "$SCHEME" \
              -destination "id=$UDID" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath "build/UITestResults-$1.xcresult" \
              -only-testing:PipUITests \
              CODE_SIGN_IDENTITY="-" \
              | xcbeautify --renderer github-actions
          }
          run_ui 1 || { echo "::warning::UI tests failed once; retrying after simulator warm-up"; run_ui 2; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/*.xcresult
          if-no-files-found: ignore

  privacy-audit:
    name: Privacy audit (no tracking SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify privacy manifests and absence of tracking dependencies
        run: scripts/privacy-audit.sh
