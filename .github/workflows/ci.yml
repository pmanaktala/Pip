name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Pip
  PROJECT: Pip.xcodeproj
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer the newest Xcode on the image (Xcode 27 when available). iOS 27-only APIs are
          # guarded at compile time, so the project also builds with the iOS 26 SDK.
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true

      - name: Resolve simulator
        id: sim
        run: |
          # Use the newest iPhone available in the runtime list so the workflow does not rot.
          NAME=$(xcrun simctl list devices available | grep -E "iPhone (17|16) Pro \(" | head -1 | sed -E 's/^ *(iPhone [0-9]+ Pro).*/\1/')
          echo "name=${NAME:-iPhone 16 Pro}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/Pip.app

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  privacy-audit:
    name: Privacy audit (no tracking SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify privacy manifests and absence of tracking dependencies
        run: scripts/privacy-audit.sh
